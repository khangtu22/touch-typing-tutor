<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyFlow • Premium 10-Finger Touch Typing Tutor</title>
  <meta name="description" content="Master 10-finger touch typing through progressive muscle memory, mechanical sound profiles, custom code practice, and ghost racing.">
  <meta name="theme-color" content="#7C5CFC">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets with Cache-Busting Versioning -->
  <link rel="stylesheet" href="styles/main.css?v=3.9.8">
  <link rel="stylesheet" href="styles/themes.css?v=3.8.5">
  <link rel="stylesheet" href="styles/keyboard.css?v=3.8.4">
  <link rel="stylesheet" href="styles/hand-guide.css?v=3.8.1">
  <link rel="stylesheet" href="styles/typing-area.css?v=3.9.8">
  <link rel="stylesheet" href="styles/dashboard.css?v=3.9.1">
  <link rel="stylesheet" href="styles/custom-practice.css?v=3.9.6-polish">
  <link rel="stylesheet" href="styles/racing.css?v=3.8.1-race2">
  <link rel="stylesheet" href="styles/results.css?v=3.9.7">
  <link rel="stylesheet" href="styles/components.css?v=3.9.6-polish">
  <link rel="stylesheet" href="styles/premium.css?v=3.9.8">
  <link rel="stylesheet" href="styles/speed-test.css?v=3.9.5-highlight-restored">
  <link rel="stylesheet" href="styles/arcade.css?v=3.9.0">
  <link rel="stylesheet" href="styles/typing-quest.css?v=3.8.1">
  <link rel="stylesheet" href="styles/arcade-challenges.css?v=3.9.0">
</head>
<body class="theme-dark">
  <!-- Apply the saved theme before the rest of the app is painted. -->
  <script>
    (() => {
      try {
        const saved = JSON.parse(localStorage.getItem('typing_tutor_progress') || 'null');
        const theme = saved?.settings?.theme;
        const supportedThemes = ['dark', 'retro', 'cyberpunk', 'botanical', 'tokyo'];
        if (supportedThemes.includes(theme)) document.body.className = `theme-${theme}`;
      } catch (error) {
        // The application will fall back to its default theme if storage is unavailable.
      }
    })();
  </script>
  <div class="app-container">
    <!-- Header Navigation -->
    <header class="app-header">
      <div class="header-inner">
      <button id="nav-brand" class="nav-brand" type="button" aria-label="Go to Lessons">
        <span class="brand-icon" aria-hidden="true">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"/></svg>
        </span>
        <span class="brand-name">KeyFlow</span>
      </button>

      <div class="nav-center-stats" role="group" aria-label="Your progress">
        <span id="nav-level-badge" class="header-level-badge">Lvl 1</span>
        <div class="header-xp-container">
          <div class="header-xp-text" id="nav-xp-text">0 XP</div>
          <div class="header-xp-bar" role="progressbar" aria-label="Progress to next level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="nav-xp-fill" class="header-xp-fill" style="width: 0%;"></div>
          </div>
        </div>
        <div class="header-streak-badge" title="Daily practice streak">
          <span id="nav-streak-flame" class="flame-icon" aria-hidden="true">🔥</span>
          <span id="nav-streak-count">0</span>
          <span class="header-streak-label">day streak</span>
        </div>
      </div>

      <nav class="nav-actions" aria-label="Main navigation">
        <button id="nav-dashboard-btn" class="nav-btn nav-btn-active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Lessons</span>
        </button>
        <button id="nav-code-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Code Arena</span>
        </button>
        <button id="nav-speedtest-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Speed Test</span>
        </button>
        <button id="nav-arcade-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4m-2-2v4m8-2h.01m3-2h.01"/></svg>
          <span>Arcade</span>
        </button>
        <button id="nav-custom-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Custom</span>
        </button>
        <button id="nav-quotes-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Quotes</span>
        </button>
        <button id="nav-profile-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Analytics</span>
        </button>
      </nav>

      <div class="nav-utilities" role="group" aria-label="App tools">
        <button id="nav-palette-btn" class="nav-btn nav-btn-palette" type="button" aria-label="Open command palette" title="Command Palette (Cmd+K / Ctrl+K)">
          <span>⌘K</span>
        </button>
        <button id="nav-settings-btn" class="nav-btn nav-icon-btn" type="button" aria-label="Settings" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="nav-shortcuts-btn" class="nav-btn nav-icon-btn" type="button" aria-label="Show keyboard shortcuts" title="Keyboard Shortcuts (?)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </div>
      </div>
    </header>

    <!-- Fill persisted header values before the application module finishes loading. -->
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('typing_tutor_progress') || 'null');
          const xp = Number(saved?.xp);
          if (!Number.isFinite(xp)) return;

          const getXpForLevel = level => level <= 1 ? 0 : Math.floor(120 * Math.pow(level - 1, 1.45));
          let level = 1;
          while (level < 30 && xp >= getXpForLevel(level + 1)) level++;

          const currentLevelXp = getXpForLevel(level);
          const nextLevelXp = level >= 30 ? currentLevelXp + 5000 : getXpForLevel(level + 1);
          const progress = Math.min(100, Math.max(0, Math.round(
            ((xp - currentLevelXp) / (nextLevelXp - currentLevelXp)) * 100
          )));

          document.getElementById('nav-level-badge').textContent = `Lvl ${level}`;
          document.getElementById('nav-xp-text').textContent = `${xp.toLocaleString()} XP`;
          document.getElementById('nav-xp-fill').style.width = `${progress}%`;
          document.querySelector('.header-xp-bar').setAttribute('aria-valuenow', String(progress));
          document.getElementById('nav-streak-count').textContent = `${Number(saved.dailyStreak) || 0}`;
        } catch (error) {
          // The application will populate the default header if storage is unavailable.
        }
      })();
    </script>

    <!-- Main Screens Container -->
    <main class="main-content">
      <!-- 1. Onboarding Screen -->
      <section id="screen-onboarding" class="screen-view" role="region" aria-label="Onboarding" tabindex="-1"></section>

      <!-- 2. Dashboard Screen -->
      <section id="screen-dashboard" class="screen-view screen-active" role="region" aria-label="Curriculum dashboard" tabindex="-1"></section>

      <!-- 3. Custom Arena Screen -->
      <section id="screen-custom" class="screen-view" role="region" aria-label="Custom practice arena" tabindex="-1"></section>

      <!-- 4. Lesson & Typing Screen -->
      <section id="screen-lesson" class="screen-view" role="region" aria-label="Typing lesson" tabindex="-1">
        <div class="lesson-screen-layout">
          <div class="lesson-session-toolbar">
            <button id="lesson-back-btn" class="lesson-back-btn" type="button">
              <span aria-hidden="true">←</span> <span id="lesson-back-label">Lessons</span>
            </button>
            <div class="lesson-appearance-controls">
              <label class="sr-only" for="lesson-theme-select">Typing theme</label>
              <select id="lesson-theme-select" class="lesson-theme-select"></select>
              <button id="lesson-keyboard-toggle" class="lesson-tool-btn" type="button" aria-pressed="true">Keyboard</button>
              <button id="hud-distraction-free-btn" class="hud-distract-toggle-btn" type="button" aria-pressed="false" title="Toggle Distraction-Free Mode (⌘/Ctrl + Shift + D)">
                <span class="distract-icon" aria-hidden="true">◎</span>
                <span class="distract-label">Distraction-free</span>
              </button>
            </div>
          </div>
          <!-- Ghost Race Track Container -->
          <div id="race-track-container" class="race-track-container">
            <div class="race-track-header">
              <div class="race-competitor-info">
                <span id="race-competitor-avatar">🤖</span>
                <span id="race-competitor-name">Fox Bot (50 WPM)</span>
              </div>
              <span id="race-delta-chip" class="race-delta-chip tied">Neck &amp; Neck</span>
            </div>
            <div class="race-lanes">
              <div class="race-lane">
                <div id="race-user-marker" class="race-marker marker-user" style="left: 0%;">👤</div>
                <span class="race-finish-flag">🏁</span>
              </div>
              <div class="race-lane">
                <div id="race-competitor-marker" class="race-marker marker-competitor" style="left: 0%;">🤖</div>
                <span class="race-finish-flag">🏁</span>
              </div>
            </div>
          </div>

          <!-- Lesson HUD -->
          <div class="lesson-hud">
            <div class="hud-top-row">
              <div id="hud-timer-wrapper" class="timer-pill" hidden role="timer" aria-label="Time remaining">
                <span id="hud-timer" class="metric-pill-val">0:00</span>
                <span class="metric-pill-lbl">LEFT</span>
              </div>
              <div class="hud-meta">
                <h2 id="hud-lesson-title" class="hud-title">Find Your Anchors</h2>
                <div class="hud-meta-details">
                  <span id="hud-lesson-round" class="hud-round-badge">Warmup · Round 1 of 4</span>
                  <span id="hud-correction-badge" class="hud-mode-badge" style="display: none;">Correction Mode</span>
                </div>
              </div>
              <div class="hud-live-metrics">
                <div class="metric-pill">
                  <span id="hud-wpm" class="metric-pill-val">0</span>
                  <span class="metric-pill-lbl">WPM</span>
                </div>
                <div class="metric-pill">
                  <span id="hud-accuracy" class="metric-pill-val">100%</span>
                  <span class="metric-pill-lbl">ACC</span>
                </div>
                <div id="hud-combo-wrapper" class="combo-pill">
                  <span id="hud-combo" class="metric-pill-val">0</span>
                  <span class="metric-pill-lbl">COMBO</span>
                </div>
                <span id="hud-timer-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></span>
              </div>
            </div>
            <div class="hud-progress-track">
              <div id="hud-progress-fill" class="hud-progress-fill" style="width: 0%;"></div>
            </div>
          </div>

          <p id="lesson-technique-cue" class="lesson-technique-cue" aria-live="polite" hidden></p>

          <!-- Active Text Box -->
          <div class="typing-box-card">
            <div class="typing-card-heading">
              <span id="typing-session-status" class="typing-session-status">Start typing to begin</span>
              <span id="typing-session-format" class="typing-session-format"></span>
            </div>
            <div class="typing-text-viewport" aria-live="off">
              <div id="typing-text-display" class="typing-text-display">
                <div id="typing-smooth-caret" class="typing-smooth-caret" aria-hidden="true">
                  <div class="smooth-caret-box"></div>
                  <div class="smooth-caret-line"></div>
                </div>
                <div id="typing-text-content" class="typing-text-content"></div>
              </div>
            </div>
          </div>

          <div class="lesson-session-footer">
            <span><kbd>esc</kbd> pause <span class="lesson-footer-separator">·</span> Settle into a steady rhythm.</span>
            <button id="lesson-restart-btn" class="lesson-back-btn" type="button"><span aria-hidden="true">↻</span> Restart</button>
          </div>

          <!-- Mechanical Keyboard with Integrated Hand Overlay -->
          <div id="keyboard-container" class="mech-keyboard-container"></div>
        </div>
      </section>

      <!-- 5. Results Screen -->
      <section id="screen-results" class="screen-view" role="region" aria-label="Practice results" tabindex="-1"></section>

      <!-- 6. Profile & Analytics Screen -->
      <section id="screen-profile" class="screen-view" role="region" aria-label="Analytics and profile" tabindex="-1"></section>

      <!-- 7. Settings Screen -->
      <section id="screen-settings" class="screen-view" role="region" aria-label="Settings" tabindex="-1"></section>

      <!-- 8. Quote Vault Screen -->
      <section id="screen-quotes" class="screen-view" role="region" aria-label="Quote vault" tabindex="-1"></section>

      <!-- 9. Arcade Gaming Hub Screen -->
      <section id="screen-arcade" class="screen-view" role="region" aria-label="Arcade" tabindex="-1"></section>

      <!-- 10. Developer Code Arena Screen -->
      <section id="screen-code" class="screen-view" role="region" aria-label="Code arena" tabindex="-1"></section>

      <!-- 11. Benchmark Speed Test Screen -->
      <section id="screen-speedtest" class="screen-view" role="region" aria-label="Speed tests" tabindex="-1"></section>
    </main>

    <!-- Certificate Modal Container -->
    <div id="certificate-modal-container"></div>

    <!-- Floating Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Celebration Confetti Canvas/Container -->
    <div id="confetti-container" class="confetti-container"></div>
  </div>

  <!-- Main JavaScript Module -->
  <script type="module" src="js/app.js?v=3.9.8"></script>
</body>
</html>
