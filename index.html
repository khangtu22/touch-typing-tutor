<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyFlow • Premium 10-Finger Touch Typing Tutor</title>
  <meta name="description" content="Master 10-finger touch typing through progressive muscle memory, mechanical sound profiles, custom code practice, and ghost racing.">
  <meta name="theme-color" content="#7C5CFC">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets with Cache-Busting Versioning -->
  <link rel="stylesheet" href="styles/main.css?v=2.3.0">
  <link rel="stylesheet" href="styles/themes.css?v=2.3.0">
  <link rel="stylesheet" href="styles/keyboard.css?v=2.3.0">
  <link rel="stylesheet" href="styles/hand-guide.css?v=2.3.0">
  <link rel="stylesheet" href="styles/typing-area.css?v=2.3.0">
  <link rel="stylesheet" href="styles/dashboard.css?v=2.3.2">
  <link rel="stylesheet" href="styles/custom-practice.css?v=2.3.0">
  <link rel="stylesheet" href="styles/racing.css?v=2.3.0">
  <link rel="stylesheet" href="styles/results.css?v=2.3.2">
  <link rel="stylesheet" href="styles/components.css?v=2.3.0">
  <link rel="stylesheet" href="styles/premium.css?v=3.0.0">
</head>
<body class="theme-dark">
  <!-- Apply the saved theme before the rest of the app is painted. -->
  <script>
    (() => {
      try {
        const saved = JSON.parse(localStorage.getItem('typing_tutor_progress') || 'null');
        const theme = saved?.settings?.theme;
        const supportedThemes = ['dark', 'retro', 'cyberpunk', 'botanical', 'tokyo'];
        if (supportedThemes.includes(theme)) document.body.className = `theme-${theme}`;
      } catch (error) {
        // The application will fall back to its default theme if storage is unavailable.
      }
    })();
  </script>
  <div class="app-container">
    <!-- Header Navigation -->
    <header class="app-header">
      <div id="nav-brand" class="nav-brand">
        <div class="brand-icon">⌨️</div>
        <span class="brand-name">KeyFlow</span>
      </div>

      <div class="nav-center-stats">
        <span id="nav-level-badge" class="header-level-badge">Lvl 1</span>
        <div class="header-xp-container">
          <div class="header-xp-text" id="nav-xp-text">0 XP</div>
          <div class="header-xp-bar">
            <div id="nav-xp-fill" class="header-xp-fill" style="width: 0%;"></div>
          </div>
        </div>
        <div class="header-streak-badge">
          <span id="nav-streak-flame" class="flame-icon">🔥</span>
          <span id="nav-streak-count">0</span>
        </div>
      </div>

      <nav class="nav-actions">
        <button id="nav-dashboard-btn" class="nav-btn nav-btn-active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Curriculum</span>
        </button>
        <button id="nav-custom-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Custom Arena</span>
        </button>
        <button id="nav-quotes-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Quote Vault</span>
        </button>
        <button id="nav-profile-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Analytics</span>
        </button>
        <button id="nav-settings-btn" class="nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
        <button id="nav-premium-btn" class="premium-crown" title="Premium Features">
          <span class="crown-icon">👑</span>
          <span id="nav-premium-label">Free</span>
        </button>
        <button id="nav-shortcuts-btn" class="nav-btn" title="Keyboard Shortcuts (?)" style="padding: 8px 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </nav>
    </header>

    <!-- Fill persisted header values before the application module finishes loading. -->
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('typing_tutor_progress') || 'null');
          const xp = Number(saved?.xp);
          if (!Number.isFinite(xp)) return;

          const getXpForLevel = level => level <= 1 ? 0 : Math.floor(120 * Math.pow(level - 1, 1.45));
          let level = 1;
          while (level < 30 && xp >= getXpForLevel(level + 1)) level++;

          const currentLevelXp = getXpForLevel(level);
          const nextLevelXp = level >= 30 ? currentLevelXp + 5000 : getXpForLevel(level + 1);
          const progress = Math.min(100, Math.max(0, Math.round(
            ((xp - currentLevelXp) / (nextLevelXp - currentLevelXp)) * 100
          )));

          document.getElementById('nav-level-badge').textContent = `Lvl ${level}`;
          document.getElementById('nav-xp-text').textContent = `${xp.toLocaleString()} XP`;
          document.getElementById('nav-xp-fill').style.width = `${progress}%`;
          document.getElementById('nav-streak-count').textContent = `${Number(saved.dailyStreak) || 0}`;
        } catch (error) {
          // The application will populate the default header if storage is unavailable.
        }
      })();
    </script>

    <!-- Main Screens Container -->
    <main class="main-content">
      <!-- 1. Onboarding Screen -->
      <section id="screen-onboarding" class="screen-view"></section>

      <!-- 2. Dashboard Screen -->
      <section id="screen-dashboard" class="screen-view screen-active"></section>

      <!-- 3. Custom Arena Screen -->
      <section id="screen-custom" class="screen-view"></section>

      <!-- 4. Lesson & Typing Screen -->
      <section id="screen-lesson" class="screen-view">
        <div class="lesson-screen-layout">
          <!-- Ghost Race Track Container -->
          <div id="race-track-container" class="race-track-container">
            <div class="race-track-header">
              <div class="race-competitor-info">
                <span id="race-competitor-avatar">🤖</span>
                <span id="race-competitor-name">Fox Bot (50 WPM)</span>
              </div>
              <span id="race-delta-chip" class="race-delta-chip tied">Neck &amp; Neck</span>
            </div>
            <div class="race-lanes">
              <div class="race-lane">
                <div id="race-user-marker" class="race-marker marker-user" style="left: 0%;">👤</div>
                <span class="race-finish-flag">🏁</span>
              </div>
              <div class="race-lane">
                <div id="race-competitor-marker" class="race-marker marker-competitor" style="left: 0%;">🤖</div>
                <span class="race-finish-flag">🏁</span>
              </div>
            </div>
          </div>

          <!-- Lesson HUD -->
          <div class="lesson-hud">
            <div class="hud-top-row">
              <div class="hud-meta">
                <h2 id="hud-lesson-title" class="hud-title">Find Your Anchors</h2>
                <span id="hud-lesson-round" class="hud-round-badge">Warmup · Round 1 of 4</span>
              </div>
              <div class="hud-live-metrics">
                <div class="metric-pill">
                  <span id="hud-wpm" class="metric-pill-val">0</span>
                  <span class="metric-pill-lbl">WPM</span>
                </div>
                <div class="metric-pill">
                  <span id="hud-accuracy" class="metric-pill-val">100%</span>
                  <span class="metric-pill-lbl">ACC</span>
                </div>
                <div id="hud-combo-wrapper" class="combo-pill">
                  <span id="hud-combo" class="metric-pill-val">0</span>
                  <span class="metric-pill-lbl">COMBO</span>
                </div>
              </div>
            </div>
            <div class="hud-progress-track">
              <div id="hud-progress-fill" class="hud-progress-fill" style="width: 0%;"></div>
            </div>
          </div>

          <!-- Active Text Box -->
          <div class="typing-box-card">
            <div id="typing-text-display" class="typing-text-display"></div>
          </div>

          <!-- Mechanical Keyboard with Integrated Hand Overlay -->
          <div id="keyboard-container" class="mech-keyboard-container"></div>
        </div>
      </section>

      <!-- 5. Results Screen -->
      <section id="screen-results" class="screen-view"></section>

      <!-- 6. Profile & Analytics Screen -->
      <section id="screen-profile" class="screen-view"></section>

      <!-- 7. Settings Screen -->
      <section id="screen-settings" class="screen-view"></section>

      <!-- 8. Quote Vault Screen -->
      <section id="screen-quotes" class="screen-view"></section>
    </main>

    <!-- Floating Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Celebration Confetti Canvas/Container -->
    <div id="confetti-container" class="confetti-container"></div>
  </div>

  <!-- Main JavaScript Module -->
  <script type="module" src="js/app.js?v=3.0.0"></script>
</body>
</html>
